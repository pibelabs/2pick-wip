<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Du stehst auf der Liste.</title>
        <link rel="stylesheet" href="https://use.typekit.net/ebw6cix.css" />
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            font-family:
                &quot;p22-mackinac-pro&quot;, &quot;parabolica&quot;, sans-serif;
        "
    >
        <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="background-color: #fafafa; padding: 48px 16px"
        >
            <tr>
                <td align="center">
                    <table
                        width="520"
                        cellpadding="0"
                        cellspacing="0"
                        style="max-width: 520px; width: 100%"
                    >
                        <!-- Header -->
                        <tr>
                            <td style="padding-bottom: 32px">
                                <p
                                    style="
                                        margin: 0;
                                        font-family:
                                            &quot;p22-mackinac-pro&quot;,
                                            &quot;parabolica&quot;, sans-serif;
                                        font-size: 13px;
                                        letter-spacing: 0.1em;
                                        text-transform: uppercase;
                                        color: #999;
                                    "
                                >
                                    2pick
                                </p>
                            </td>
                        </tr>

                        <!-- Headline -->
                        <tr>
                            <td style="padding-bottom: 24px">
                                <h1
                                    style="
                                        margin: 0;
                                        font-family:
                                            &quot;p22-mackinac-pro&quot;,
                                            &quot;parabolica&quot;, sans-serif;
                                        font-size: 24px;
                                        font-weight: 500;
                                        color: #1a1a1a;
                                        line-height: 1.3;
                                    "
                                >
                                    Du bist auf der Warteliste
                                </h1>
                            </td>
                        </tr>

                        <!-- Body -->
                        <tr>
                            <td style="padding-bottom: 32px">
                                <p
                                    style="
                                        margin: 0;
                                        font-family:
                                            &quot;parabolica&quot;, sans-serif;
                                        font-size: 15px;
                                        color: #555;
                                        line-height: 1.7;
                                    "
                                >
                                    Danke für deine Anmeldung. Wir melden uns,
                                    sobald du an der Reihe bist.
                                </p>
                            </td>
                        </tr>

                        <!-- Rule -->
                        <tr>
                            <td
                                style="
                                    border-top: 1px solid #eaeaea;
                                    padding-bottom: 24px;
                                "
                            ></td>
                        </tr>

                        <!-- Unregister section -->
                        <tr>
                            <td style="padding-bottom: 48px">
                                <p
                                    style="
                                        margin: 0 0 12px 0;
                                        font-family:
                                            &quot;parabolica&quot;, sans-serif;
                                        font-size: 14px;
                                        color: #777;
                                        line-height: 1.6;
                                    "
                                >
                                    Möchtest du dich abmelden? Deine Daten
                                    werden dabei nicht gespeichert.
                                </p>
                                <a
                                    href="{{ unsubscribe_link }}"
                                    style="
                                        color: #555;
                                        font-family:
                                            &quot;parabolica&quot;, sans-serif;
                                        font-size: 14px;
                                        text-decoration: underline;
                                    "
                                >
                                    Von der Warteliste abmelden
                                </a>
                            </td>
                        </tr>

                        <!-- Footer -->
                        <tr>
                            <td
                                style="
                                    border-top: 1px solid #eaeaea;
                                    padding-top: 24px;
                                "
                            >
                                <p
                                    style="
                                        margin: 0;
                                        font-family:
                                            &quot;parabolica&quot;, sans-serif;
                                        font-size: 12px;
                                        color: #aaa;
                                        line-height: 1.7;
                                    "
                                >
                                    Du erhältst diese E-Mail, weil du dich auf
                                    2pick.de angemeldet hast.<br />
                                    © 2pick, München.
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
